[platformio]
default_envs = esp32_a

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    jgromes/RadioLib@7.1.2

[env:esp32_a]
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
build_flags =
    -D NODE_ROLE_A=1
    -D RF_CORRECTION_PPM=65

[env:esp32_b]
upload_port = /dev/ttyUSB1
monitor_port = /dev/ttyUSB1
build_flags =
    -D NODE_ROLE_A=0
    -D RF_CORRECTION_PPM=0
