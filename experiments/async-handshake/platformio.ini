[platformio]
default_envs = esp32_a, esp32_b

[env]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -D RF_FREQ_A_HZ=433920000UL
    -D RF_FREQ_B_HZ=433500000UL
    -D SAMPLE_PERIOD_US=104
    -D TURNAROUND_DELAY_MS=150
    -D REPLY_TIMEOUT_MS=10000
    -D RETRY_INTERVAL_MS=1000
    -D MIN_INTERFRAME_MS=2000
    -D DUTY_PERMILLE=50
    -D RF_SESSION_MS=60000
    -D RAW_OOK_TEST=0

[env:esp32_a]
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
build_flags =
    ${env.build_flags}
    -D NODE_ROLE_A
    -D RF_FREQ_OFFSET=71

[env:esp32_b]
upload_port = /dev/ttyUSB1
monitor_port = /dev/ttyUSB1
build_flags =
    ${env.build_flags}
    -D NODE_ROLE_B
    -D RF_FREQ_OFFSET=0
