[platformio]
default_envs = esp32_a

[env]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800

[env:esp32_a]
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
build_flags =
  -D NODE_ROLE_A=1
  -D RF_FREQ_A_HZ=433920000UL
  -D RF_FREQ_B_HZ=433500000UL
  -D RF_FREQ_OFFSET=71

[env:esp32_b]
upload_port = /dev/ttyUSB1
monitor_port = /dev/ttyUSB1
build_flags =
  -D NODE_ROLE_B=1
  -D RF_FREQ_A_HZ=433920000UL
  -D RF_FREQ_B_HZ=433500000UL
  -D RF_FREQ_OFFSET=0
